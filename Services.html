<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <img src="logo.png" alt="logo">
  <div class="links">
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<section class="section fade-in">
  <h1>Nos Services</h1>

  <div class="grid">
    <div class="card">
      <h3>Création Vidéo</h3>
      <p>Contenu cinématique pour marques et réseaux sociaux.</p>
    </div>

    <div class="card">
      <h3>Branding</h3>
      <p>Identité visuelle forte et moderne.</p>
    </div>

    <div class="card">
      <h3>Photographie</h3>
      <p>Images artistiques et commerciales haut de gamme.</p>
    </div>

    <div class="card">
      <h3>Direction Artistique</h3>
      <p>Vision créative complète pour projets médias.</p>
    </div>
  </div>
</section>

<script>
const elements = document.querySelectorAll('.fade-in');
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) entry.target.classList.add('show');
  });
});
elements.forEach(el => observer.observe(el));
</script>

</body>
</html>
